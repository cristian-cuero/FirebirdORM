name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: TypeCheck (JSDoc)
        run: npx tsc -p jsconfig.json --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration-tests:
    name: Integration Tests (Firebird ${{ matrix.fb-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fb-version: ['3.0', '4.0', '5.0']
        include:
          - fb-version: '3.0'
            image: jacobalberty/firebird:3.0-latest
            port: 3050
          - fb-version: '4.0'
            image: jacobalberty/firebird:4.0-latest
            port: 3050
          - fb-version: '5.0'
            image: jacobalberty/firebird:5.0-latest
            port: 3050
    services:
      firebird:
        image: ${{ matrix.image }}
        env:
          ISC_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_USER: SYSDBA
          FIREBIRD_PASSWORD: masterkey
        ports:
          - ${{ matrix.port }}:3050
        options: >-
          --health-cmd="isql -q -user SYSDBA -password masterkey localhost:/tmp/firebird/test.fdb -e 'select 1 from rdb$database;'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for Firebird to be ready
        run: |
          for i in {1..30}; do
            if nc -z localhost ${{ matrix.port }}; then
              echo "Firebird ${{ matrix.fb-version }} is ready"
              exit 0
            fi
            echo "Waiting for Firebird... ($i/30)"
            sleep 2
          done
          echo "Firebird failed to start"
          exit 1

      - name: Run integration tests
        env:
          FB_HOST: localhost
          FB_PORT: ${{ matrix.port }}
          FB_DATABASE: test.fdb
          FB_USER: SYSDBA
          FB_PASSWORD: masterkey
        run: npm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/esm/index.js && echo "ESM OK"
          test -f dist/cjs/index.js && echo "CJS OK"
          test -f dist/types/index.d.ts && echo "Types OK" || echo "Types missing (run tsc separately)"

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, integration-tests, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}