name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # package.json currently contains dotenv but package-lock.json does not.
      # npm install resolves the manifest/lock mismatch in this ephemeral runner.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: TypeCheck (JSDoc)
        run: npx tsc -p jsconfig.json --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm run test:unit

  integration-tests:
    name: Integration Tests (Firebird 2.5, 3, 4 & 5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The integration suite connects to all four ports in the repository's
      # docker-compose.yml, so all Firebird services must run in the same job.
      - name: Start Firebird matrix
        run: docker compose up -d

      - name: Wait for all Firebird instances
        shell: bash
        run: |
          set -e
          for port in 3053 3050 3054 3052; do
            ready=false
            for attempt in {1..60}; do
              if nc -z 127.0.0.1 "$port"; then
                echo "Firebird on port $port is ready"
                ready=true
                break
              fi
              echo "Waiting for Firebird on port $port ($attempt/60)"
              sleep 2
            done
            if [ "$ready" != true ]; then
              echo "Firebird on port $port did not become ready"
              docker compose ps
              docker compose logs
              exit 1
            fi
          done

      - name: Show Firebird services
        run: docker compose ps

      - name: Run integration tests
        run: npm run test:integration

      - name: Stop Firebird services
        if: always()
        run: docker compose down

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/esm/index.js && echo "ESM OK"
          test -f dist/cjs/index.js && echo "CJS OK"
          test -f dist/types/index.d.ts && echo "Types OK" || echo "Types missing (run tsc separately)"

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, integration-tests, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
